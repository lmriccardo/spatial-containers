name: Build C++ Docker Image

on:
  push:
    branches:
      - devel
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read # Permission to read the repo files
      packages: write # Necessary to push packages/images to GHCR
    
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4
      
      - name: 🔐 Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏗 Build Docker image and Tag with SHA
        run: |
          IMAGE_NAME=ghcr.io/${{ github.repository }}/spatial-container
          docker build -t $IMAGE_NAME:latest .
          docker tag $IMAGE_NAME:latest $IMAGE_NAME:${{ github.sha }}

      - name: 🔍 Check if image with this SHA already exists
        id: check
        run: |
          LOCAL_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' $IMAGE_NAME || echo "")
          REMOTE_DIGEST=$(docker manifest inspect $IMAGE_NAME 2>/dev/null | jq -r '.config.digest' || echo "")
          
          echo "LOCAL_DIGEST=$LOCAL_DIGEST" >> $GITHUB_ENV
          echo "REMOTE_DIGEST=$REMOTE_DIGEST" >> $GITHUB_ENV
          
          if [ "$LOCAL_DIGEST" = "$REMOTE_DIGEST" ]; then
            echo "CHANGED=false" >> $GITHUB_OUTPUT
          else
            echo "CHANGED=true" >> $GITHUB_OUTPUT
          fi

      - name: ⬆️ Push Docker image
        if: steps.check.outputs.CHANGED == 'true'
        run: |
          IMAGE_NAME=ghcr.io/${{ github.repository }}/spatial-container
          docker push $IMAGE_NAME:latest
          docker push $IMAGE_NAME:${{ github.sha }}